[project]
name = "todo-app"
version = "1.0.0"
description = "ToDo-сервис на archtool + web_fractal + FastAPI + SQLAlchemy (async)"
requires-python = ">=3.11"
dependencies = [
    "archtool==2.1.1",
    "web_fractal==0.0.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.7",
    "email-validator>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "furl>=2.1",
    "pytz>=2024.1",
    "aiohttp>=3.9",
]

[tool.setuptools]
packages = ["app", "entrypoints"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
