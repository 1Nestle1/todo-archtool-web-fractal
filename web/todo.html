<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>todo.svc - your list</title>
<meta name="description" content="A working ToDo list with colored labels and lists, backed by the archtool + web_fractal API." />
<style>
  :root {
    --bg: #0a0b0d;
    --surface: #111317;
    --surface-2: #171a1f;
    --surface-3: #1d2026;
    --border: #24272e;
    --border-soft: #1b1e24;
    --text: #ECEDEF;
    --muted: #989aa2;
    --muted-2: #6c6f77;
    --accent: #c6f24e;
    --accent-press: #b4e23a;
    --danger: #ff6b6b;
    --ok: #5fd0a0;
    --r: 12px;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(56rem 40rem at 78% -12%, rgba(198,242,78,.06), transparent 60%);
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: var(--sans); }
  .mono { font-family: var(--mono); }

  /* ── shell ── */
  .shell { display: grid; grid-template-columns: 264px 1fr; height: 100dvh; }

  /* ── sidebar ── */
  .sidebar { border-right: 1px solid var(--border-soft); display: flex; flex-direction: column; min-height: 0; background: rgba(17,19,23,.5); }
  .side-top { padding: 20px 20px 14px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -0.02em; }
  .brand .dot { width: 12px; height: 12px; border-radius: 4px; background: var(--accent); }
  .brand .back { color: var(--muted-2); font-size: 12px; font-weight: 500; }
  .side-label { padding: 8px 20px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted-2); }
  .lists-nav { flex: 1; overflow-y: auto; padding: 2px 12px; min-height: 0; }
  .list-item { width: 100%; display: flex; align-items: center; gap: 11px; padding: 9px 10px; border: none; background: transparent; color: var(--muted); border-radius: 9px; cursor: pointer; font-size: 14px; transition: background .15s ease, color .15s ease; text-align: left; }
  .list-item:hover { background: var(--surface-2); color: var(--text); }
  .list-item.active { background: var(--surface-3); color: var(--text); }
  .list-item .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .list-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-item .ct { font-family: var(--mono); font-size: 11.5px; color: var(--muted-2); }
  .new-list { margin: 8px 16px 4px; padding: 9px 10px; border: 1px dashed var(--border); background: transparent; color: var(--muted); border-radius: 9px; cursor: pointer; font-size: 13px; transition: all .15s ease; }
  .new-list:hover { color: var(--text); border-color: #3a3e46; }
  .side-bottom { border-top: 1px solid var(--border-soft); padding: 14px 16px; }
  .user-card { display: flex; align-items: center; gap: 11px; }
  .avatar { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg,#c6f24e,#5fd0a0); color: #0a0b0d; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; }
  .user-card .info { flex: 1; min-width: 0; }
  .user-card .nm { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-card .em { font-size: 11.5px; color: var(--muted-2); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .switch { background: transparent; border: none; color: var(--muted-2); cursor: pointer; font-size: 12px; padding: 4px; }
  .switch:hover { color: var(--accent); }

  /* ── main ── */
  .main { display: flex; flex-direction: column; min-height: 0; }
  .main-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 22px 30px 18px; border-bottom: 1px solid var(--border-soft); }
  .main-head h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  .main-head .sub { font-size: 13px; color: var(--muted-2); margin-top: 3px; }
  .prog { display: flex; align-items: center; gap: 12px; }
  .prog .num { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .prog .num b { color: var(--text); }
  .bar { width: 130px; height: 7px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 999px; transition: width .4s cubic-bezier(.16,1,.3,1); }

  .composer { padding: 18px 30px; border-bottom: 1px solid var(--border-soft); }
  .title-row { display: flex; gap: 12px; }
  .title-in { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 13px 14px; font-size: 15px; outline: none; transition: border-color .15s ease; }
  .title-in:focus { border-color: var(--accent); }
  .title-in::placeholder { color: var(--muted-2); }
  .opts { display: flex; align-items: center; gap: 12px; margin-top: 13px; }
  .opt-label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted-2); }
  .swatches { display: flex; align-items: center; gap: 8px; }
  .swatch { width: 22px; height: 22px; border-radius: 7px; cursor: pointer; border: 2px solid transparent; transition: transform .1s ease; }
  .swatch:hover { transform: scale(1.12); }
  .swatch.active { border-color: var(--text); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; padding: 11px 18px; border-radius: var(--r); border: 1px solid transparent; cursor: pointer; transition: transform .08s ease, background .15s ease, border-color .15s ease; white-space: nowrap; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: #0a0b0d; }
  .btn-primary:hover { background: var(--accent-press); }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-ghost:hover { border-color: #3a3e46; background: var(--surface); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .filters { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 30px; }
  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .seg button { border: none; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 7px; cursor: pointer; transition: all .15s ease; }
  .seg button.active { background: var(--surface-3); color: var(--text); }
  .filters .count { font-size: 13px; color: var(--muted-2); }

  .area { flex: 1; overflow-y: auto; padding: 4px 22px 28px; min-height: 0; }
  .group { margin: 14px 8px; }
  .group-head { display: flex; align-items: center; gap: 10px; padding: 4px 6px 10px; }
  .group-dot { width: 8px; height: 8px; border-radius: 50%; }
  .group-name { font-size: 13px; font-weight: 650; }
  .group-meta { font-size: 12px; color: var(--muted-2); font-family: var(--mono); }
  .group-line { flex: 1; height: 1px; background: var(--border-soft); }

  .task { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 11px; position: relative; transition: background .15s ease; }
  .task:hover { background: var(--surface-2); }
  .task + .task { margin-top: 2px; }
  .task .cbar { position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 999px; }
  .check { flex-shrink: 0; width: 21px; height: 21px; border-radius: 6px; border: 1.6px solid var(--border); background: transparent; cursor: pointer; position: relative; transition: all .15s ease; }
  .check:hover { border-color: var(--accent); }
  .check.done { background: var(--accent); border-color: var(--accent); cursor: default; }
  .check.done::after { content: ""; position: absolute; left: 6px; top: 2.5px; width: 5px; height: 10px; border: solid #0a0b0d; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .task .label { flex: 1; font-size: 14.5px; }
  .task.done .label { color: var(--muted-2); text-decoration: line-through; }
  .tag { font-size: 11px; font-family: var(--mono); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted-2); }
  .empty .big { font-size: 16px; color: var(--muted); margin-bottom: 6px; }

  /* api log */
  .apilog { border-top: 1px solid var(--border-soft); }
  .apilog summary { list-style: none; cursor: pointer; padding: 13px 30px; font-size: 13px; color: var(--muted); font-family: var(--mono); display: flex; align-items: center; gap: 10px; }
  .apilog summary::-webkit-details-marker { display: none; }
  .apilog summary .led { width: 7px; height: 7px; border-radius: 50%; background: var(--muted-2); }
  .apilog[open] summary .led { background: var(--accent); }
  .apilog pre { margin: 0; background: #06070a; border-top: 1px solid var(--border-soft); max-height: 200px; overflow: auto; font-size: 12px; color: #aab2bf; white-space: pre-wrap; word-break: break-word; padding: 14px 30px; font-family: var(--mono); }

  /* onboarding modal */
  .overlay { position: fixed; inset: 0; background: rgba(6,7,10,.72); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 100; }
  .modal { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: 0 40px 90px rgba(0,0,0,.5); }
  .modal h2 { margin: 0 0 6px; font-size: 21px; letter-spacing: -0.02em; }
  .modal p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .field input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 12px 13px; font-size: 14px; outline: none; }
  .field input:focus { border-color: var(--accent); }
  .err-msg { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .modal .home { display: block; text-align: center; margin-top: 16px; color: var(--muted-2); font-size: 12.5px; }

  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; height: auto; min-height: 100dvh; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border-soft); }
    .lists-nav { display: flex; gap: 6px; overflow-x: auto; }
    .list-item { width: auto; white-space: nowrap; }
    .side-label { display: none; }
    .main-head { flex-direction: column; align-items: flex-start; gap: 12px; }
  }
</style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="side-top">
        <a class="brand" href="/"><span class="dot"></span> todo.svc <span class="back">/ home</span></a>
      </div>
      <div class="side-label">Lists</div>
      <nav class="lists-nav" id="lists-nav"></nav>
      <button class="new-list" id="new-list">+ New list</button>
      <div class="side-bottom">
        <div class="user-card">
          <div class="avatar" id="avatar">A</div>
          <div class="info">
            <div class="nm" id="u-name">-</div>
            <div class="em" id="u-email">-</div>
          </div>
          <button class="switch" id="btn-switch" title="Switch user">switch</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="main-head">
        <div>
          <h1 id="list-title">All tasks</h1>
          <div class="sub" id="list-sub"></div>
        </div>
        <div class="prog">
          <span class="num"><b id="p-done">0</b> of <b id="p-total">0</b> done</span>
          <span class="bar"><i id="p-bar"></i></span>
        </div>
      </header>

      <div class="composer">
        <div class="title-row">
          <input type="text" class="title-in" id="t-title" placeholder="What needs doing?" autocomplete="off" />
          <button class="btn btn-primary" id="btn-add">Add task</button>
        </div>
        <div class="opts">
          <span class="opt-label">Color</span>
          <div class="swatches" id="swatch-row"></div>
        </div>
      </div>

      <div class="filters">
        <div class="seg" id="seg">
          <button data-f="all" class="active">All</button>
          <button data-f="active">Active</button>
          <button data-f="done">Done</button>
        </div>
        <span class="count" id="f-count"></span>
      </div>

      <div class="area" id="area"></div>

      <details class="apilog" id="apilog">
        <summary><span class="led"></span> API activity</summary>
        <pre id="log">// requests will appear here as you use the app</pre>
      </details>
    </main>
  </div>

  <!-- onboarding -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>Start your list</h2>
      <p>We register a user through POST /users/, then keep every task under that id.</p>
      <div class="field">
        <label for="ob-name">Your name</label>
        <input type="text" id="ob-name" value="Ada Lovelace" />
      </div>
      <div class="field">
        <label for="ob-email">Email</label>
        <input type="email" id="ob-email" />
      </div>
      <button class="btn btn-primary" id="btn-start" style="width:100%; margin-top:6px;">Create user and continue</button>
      <div class="err-msg" id="ob-err"></div>
      <a class="home" href="/">back to home</a>
    </div>
  </div>

<script>
  const API = window.location.origin;
  const COLORS = { lime:"#c6f24e", sky:"#7fd6ff", amber:"#f0b860", rose:"#ff8095", teal:"#5fd0a0", violet:"#b69cff" };
  const DEFAULT_GROUPS = ["Inbox", "Work", "Personal"];
  const ALL = "__all";

  const state = { user:null, todos:[], filter:"all", list:ALL, color:"lime", groups:[...DEFAULT_GROUPS] };

  const $ = (id) => document.getElementById(id);
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  const hexToRgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; };

  function logLine(method, path, status, body) {
    const stamp = new Date().toLocaleTimeString();
    const txt = typeof body === "string" ? body : JSON.stringify(body);
    $("log").textContent = `[${stamp}] ${method} ${path}  ->  ${status}\n${txt}\n\n` + $("log").textContent;
  }
  async function call(method, path, payload) {
    const opts = { method, headers: {} };
    if (payload !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(payload); }
    const res = await fetch(API + path, opts);
    const text = await res.text();
    let data; try { data = JSON.parse(text); } catch { data = text; }
    logLine(method, path, res.status, data);
    return { status: res.status, ok: res.ok, data };
  }
  const randomEmail = () => "ada+" + Math.random().toString(16).slice(2,8) + "@todo.svc";

  // ── onboarding ──
  function showOnboard() {
    state.user = null; state.todos = [];
    $("overlay").style.display = "flex";
    $("ob-email").value = randomEmail();
    $("ob-err").textContent = "";
  }
  $("btn-start").addEventListener("click", async (ev) => {
    const btn = ev.currentTarget;
    const name = $("ob-name").value.trim(), email = $("ob-email").value.trim();
    $("ob-err").textContent = "";
    if (!name || !email) { $("ob-err").textContent = "Name and email are both required."; return; }
    btn.disabled = true; const lbl = btn.textContent; btn.textContent = "Creating...";
    try {
      const { ok, status, data } = await call("POST", "/users/", { email, name });
      if (ok) { state.user = data; enter(); }
      else if (status === 409) { $("ob-err").textContent = "That email is taken, here is a fresh one."; $("ob-email").value = randomEmail(); }
      else { $("ob-err").textContent = "Could not create the user (" + status + ")."; }
    } catch (e) { $("ob-err").textContent = "Network error: " + e.message; }
    finally { btn.disabled = false; btn.textContent = lbl; }
  });
  $("btn-switch").addEventListener("click", showOnboard);

  function enter() {
    $("overlay").style.display = "none";
    $("u-name").textContent = state.user.name;
    $("u-email").textContent = state.user.email;
    $("avatar").textContent = (state.user.name || "?").trim().charAt(0).toUpperCase();
    state.list = ALL; state.color = "lime"; state.groups = [...DEFAULT_GROUPS];
    renderSwatches();
    refresh();
  }

  // ── composer ──
  function renderSwatches() {
    const row = $("swatch-row"); row.innerHTML = "";
    for (const [token, hex] of Object.entries(COLORS)) {
      const s = el("button", "swatch" + (token === state.color ? " active" : ""));
      s.style.background = hex; s.title = token;
      s.addEventListener("click", () => { state.color = token; renderSwatches(); });
      row.appendChild(s);
    }
  }
  async function addTask() {
    const title = $("t-title").value.trim();
    if (!title || !state.user) return;
    const group = state.list === ALL ? "Inbox" : state.list;
    const btn = $("btn-add"); btn.disabled = true; const lbl = btn.textContent; btn.textContent = "Adding...";
    try {
      const { ok } = await call("POST", "/todos/", { title, user_id: state.user.id, color: state.color, group });
      if (ok) { $("t-title").value = ""; await refresh(); }
    } finally { btn.disabled = false; btn.textContent = lbl; }
  }
  $("btn-add").addEventListener("click", addTask);
  $("t-title").addEventListener("keydown", (e) => { if (e.key === "Enter") addTask(); });

  async function complete(id) { const { ok } = await call("PATCH", "/todos/" + id + "/complete"); if (ok) await refresh(); }

  async function refresh() {
    if (!state.user) return;
    const { ok, data } = await call("GET", "/todos/?user_id=" + state.user.id);
    if (ok) { state.todos = Array.isArray(data) ? data : []; render(); }
  }

  // ── new list ──
  $("new-list").addEventListener("click", () => {
    const name = (prompt("Name the new list") || "").trim();
    if (!name) return;
    if (!state.groups.includes(name)) state.groups.push(name);
    state.list = name; render();
  });

  // ── filters ──
  $("seg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.filter = b.dataset.f;
    $("seg").querySelectorAll("button").forEach((x) => x.classList.toggle("active", x === b));
    render();
  });

  function allGroups() {
    const set = new Set(state.groups);
    for (const t of state.todos) set.add(t.group);
    return [...state.groups, ...[...set].filter((g) => !state.groups.includes(g)).sort()];
  }

  function renderSidebar() {
    const nav = $("lists-nav"); nav.innerHTML = "";
    const mkItem = (key, name, dotHex, count) => {
      const b = el("button", "list-item" + (state.list === key ? " active" : ""));
      const d = el("span", "dot"); d.style.background = dotHex; b.appendChild(d);
      b.appendChild(el("span", "nm", name));
      b.appendChild(el("span", "ct", count));
      b.addEventListener("click", () => { state.list = key; render(); });
      nav.appendChild(b);
    };
    const activeAll = state.todos.filter((t) => !t.is_done).length;
    mkItem(ALL, "All tasks", "#c6f24e", String(activeAll));
    for (const g of allGroups()) {
      const items = state.todos.filter((t) => t.group === g);
      const active = items.filter((t) => !t.is_done).length;
      const hex = COLORS[items[0] ? items[0].color : "lime"] || "#6c6f77";
      mkItem(g, g, hex, String(active));
    }
  }

  function render() {
    renderSidebar();
    renderSwatches();

    const scope = state.list === ALL ? state.todos : state.todos.filter((t) => t.group === state.list);
    const done = scope.filter((t) => t.is_done).length;
    const total = scope.length;
    $("list-title").textContent = state.list === ALL ? "All tasks" : state.list;
    $("list-sub").textContent = total ? (total + (total === 1 ? " task" : " tasks")) : "No tasks yet";
    $("p-done").textContent = done; $("p-total").textContent = total;
    $("p-bar").style.width = (total ? (done / total) * 100 : 0) + "%";
    const active = total - done;
    $("f-count").textContent = total ? (active + " active, " + done + " done") : "";

    const visible = scope.filter((t) => state.filter === "all" ? true : state.filter === "done" ? t.is_done : !t.is_done);
    const area = $("area"); area.innerHTML = "";

    if (total === 0) { area.appendChild(emptyState("This list is empty", "Add your first task with the field above.")); return; }
    if (visible.length === 0) { area.appendChild(emptyState("Nothing here", "No tasks match this filter.")); return; }

    if (state.list === ALL) {
      const grouped = {};
      for (const t of visible) (grouped[t.group] ||= []).push(t);
      for (const g of allGroups()) {
        if (!grouped[g]) continue;
        const groupAll = state.todos.filter((t) => t.group === g);
        const gd = groupAll.filter((t) => t.is_done).length;
        const sec = el("div", "group");
        const head = el("div", "group-head");
        const dot = el("span", "group-dot"); dot.style.background = COLORS[grouped[g][0].color] || "#6c6f77";
        head.appendChild(dot);
        head.appendChild(el("span", "group-name", g));
        head.appendChild(el("span", "group-meta", gd + "/" + groupAll.length));
        head.appendChild(el("span", "group-line"));
        sec.appendChild(head);
        for (const t of grouped[g]) sec.appendChild(taskRow(t));
        area.appendChild(sec);
      }
    } else {
      const sec = el("div", "group");
      for (const t of visible) sec.appendChild(taskRow(t));
      area.appendChild(sec);
    }
  }

  function taskRow(t) {
    const hex = COLORS[t.color] || "#6c6f77";
    const row = el("div", "task" + (t.is_done ? " done" : ""));
    const bar = el("span", "cbar"); bar.style.background = hex; row.appendChild(bar);
    const check = el("button", "check" + (t.is_done ? " done" : ""));
    check.setAttribute("aria-label", t.is_done ? "completed" : "mark complete");
    if (!t.is_done) check.addEventListener("click", () => { check.classList.add("done"); complete(t.id); });
    row.appendChild(check);
    row.appendChild(el("span", "label", t.title));
    const tag = el("span", "tag", t.color); tag.style.color = hex; tag.style.background = hexToRgba(hex, 0.12);
    row.appendChild(tag);
    return row;
  }

  function emptyState(big, small) {
    const e = el("div", "empty");
    e.appendChild(el("div", "big", big));
    e.appendChild(el("div", null, small));
    return e;
  }

  showOnboard();
</script>
</body>
</html>
